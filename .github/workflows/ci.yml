name: ROC and DeLong checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-test-secret-not-for-production-2026
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile and run Python test suite
        run: |
          python -m compileall -q agents cli.py roc_delong_cli.py enrichment.py simulator.py
          python -m pytest -v
      - name: CLI smoke tests
        run: |
          python roc_delong_cli.py compute --data sample_data.csv --label-col disease_status --score-col biomarker_a
          python roc_delong_cli.py compare --data sample_data.csv --label-col disease_status --score-a biomarker_a --score-b biomarker_b
          python cli.py verify-audit
      - name: Browser script syntax and numerical smoke tests
        run: |
          node --check web/roc.js
          node tests/browser_smoke.cjs
      - name: HTML relative asset checks
        run: |
          python -c 'from pathlib import Path; t = Path("web/index.html").read_text(); assert "./roc.js" in t and "./style.css" in t; assert Path("index.html").exists()'
