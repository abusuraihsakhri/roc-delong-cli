version: '3.8'

services:
  roc-delong-cli:
    build: .
    container_name: roc-delong-cli
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=roc-delong-cli-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
